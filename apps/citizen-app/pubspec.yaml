name: citizen_app
description: "Citizen Mobile Application for AI-powered Grievance and Problem Reporting (SIH26043)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Valley Sans
      fonts:
        - asset: assets/fonts/ValleySans-Regular.ttf
          weight: 400
        - asset: assets/fonts/ValleySans-Medium.ttf
          weight: 500
        - asset: assets/fonts/ValleySans-Bold.ttf
          weight: 700

